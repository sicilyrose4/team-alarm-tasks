<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Team Alarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1f34;--deep:#15172b;--line:#313558;--line2:#474b71;--ink:#e8e9f2;--ampm:#b0b4d9;--title:#b2b4c6;--sub:#8e90a4;--ph:#8488b0;--btn:#cbcddf;
  --sleep:#e7a099;--snz:#e0dfa2;--up:#9bbba7;
  --rnd:ui-rounded,"SF Compact Rounded","SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  --rd:"Reddit Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sf);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#app{min-height:100dvh}
svg,img{display:block;flex:none}
.scr{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 46px calc(env(safe-area-inset-bottom) + 46px);max-width:430px;margin:0 auto;position:relative;overflow:hidden}
.grow{flex:1}
.glow{position:absolute;left:50%;width:642px;height:448px;margin-left:-321px;pointer-events:none;z-index:0}
.glow.bot{bottom:-322px}
.scr>*:not(.glow):not(.fade){position:relative;z-index:1}
.time{font-family:var(--rnd);font-weight:300;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;white-space:nowrap;letter-spacing:-1px}
.time .ap{font-family:var(--rnd);font-weight:500;font-size:21px;color:var(--ampm);margin-left:6px;letter-spacing:0}
.pill{align-self:center;background:var(--btn);color:#1d1f34;border-radius:76px;padding:4px 72px;font:590 32px var(--sf);font-weight:600;line-height:38px;white-space:nowrap;transition:transform .08s}
.pill:active{transform:scale(.97)}
.pill:disabled{opacity:.35}
.link{align-self:center;padding:4px 51px;font:500 18px var(--sf);line-height:21px;color:var(--btn);margin-top:11px}
.label{font:500 18px var(--rd);color:var(--sub)}
.head{font:400 16px var(--sf);color:#fff;line-height:19px}

/* inputs */
.field{height:72px;border-radius:24px;background:var(--deep);border:1px solid var(--line);display:flex;align-items:center;padding:0 17px}
.field input{background:none;border:0;outline:0;width:100%;font:400 32px var(--sf);color:var(--ink);-webkit-user-select:text;user-select:text}
.field input::placeholder{color:var(--line)}
.scr>.sel-slot{height:53px;margin-top:36px;position:relative;z-index:5 !important}
.sel{position:absolute;left:0;right:0;top:0;border-radius:24px;background:var(--line);border:1px solid var(--line2);overflow:hidden}
.sel.open{box-shadow:0 18px 40px rgba(6,6,15,.55)}
.sel-btn{height:51px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 17px;font:400 18px var(--sf);color:var(--ph);text-align:left}
.sel-btn.has{color:var(--btn)}
.sel-btn img{transition:transform .2s}
.sel.open .sel-btn img{transform:scaleY(-1)}
.sel-list{display:none;padding:0 0 8px}
.sel.open .sel-list{display:block}
.sel-opt{display:block;width:100%;text-align:left;padding:12px 17px;font:400 18px var(--sf);color:var(--btn);border-top:1px solid var(--line2)}
.sel-opt.on{color:#fff}

/* time picker */
/* the down arrow hangs below the picker, so keep it above the spacer that follows */
.scr>.picker{z-index:3 !important}
.picker{display:flex;align-items:center;justify-content:flex-start;gap:4px;margin:0;touch-action:none}
.picker .ap-col{margin-left:auto}
/* hour wheel: fixed width, digits flush right, so the layout never moves (one or two digits, active or not) */
.col.h{width:106px}
.picker .col.h .it{text-align:right;padding-right:4px}
.col{position:relative;width:106px;height:136px;border-radius:11px;border:1px solid transparent;overflow:hidden;touch-action:none;cursor:grab}

.col.on{background:var(--deep);border-color:var(--line)}
.col .it{position:absolute;left:0;right:0;top:0;height:84px;text-align:center;font:300 84px/1 var(--rnd);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-1px;will-change:transform;pointer-events:none}
.col .it.nb{opacity:.4}
.col:not(.on) .it.nb{display:none}
.col.h:not(.on) .it{text-align:right;padding-right:4px}
.chev{position:absolute;left:50%;margin-left:-23.5px;width:27px;height:27px;padding:10px;box-sizing:content-box;border-radius:50%;display:none;z-index:2;cursor:pointer;transition:background .12s}
.chev:active,.chev.press{background:rgba(203,205,223,.16)}
.col-wrap{position:relative}
.col-wrap.on .chev{display:block}
.chev.up{top:-53px;transform:scaleY(-1)}.chev.dn{bottom:-48px}
.colon{font:300 84px/1 var(--rnd);color:var(--ink);margin-top:-10px;width:22px;text-align:center;flex:none}
.ap-col{display:flex;flex-direction:column;gap:9px;width:52px;flex:none}
.ap-col button{height:37px;border-radius:18.5px;font:500 21px var(--rnd);color:var(--ampm)}
.ap-col button.on{background:rgba(217,217,217,.2)}

/* toggle + chips */
.trow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px}
.tog{width:52px;height:30px;border-radius:15px;background:var(--line);border:1px solid var(--line2);position:relative;flex:none;transition:background .15s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--sub);transition:left .15s,background .15s}
.tog.on{background:var(--up);border-color:var(--up)}
.tog.on:after{left:25px;background:#1d1f34}
.chips{display:flex;gap:10px;margin-top:10px}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);color:#56566c;font:400 16px var(--sf);display:inline-flex;gap:8px;align-items:center}
.chip.on{background:var(--line);border-color:var(--line2);color:var(--btn)}

/* people */
.dot{border-radius:50%;flex:none;transition:background .4s}
.stack{display:flex;justify-content:center}
.stack .dot{width:48px;height:48px;margin-left:-24px}
.stack .dot:first-child{margin-left:0}
.more{font:500 18px var(--rd);color:var(--sub);text-align:center;margin-top:8px}
.ringgrid{display:grid;grid-template-columns:repeat(5,46.48px);gap:16.4px;justify-content:center;opacity:.6}
.ringgrid .dot{width:46.48px;height:46.48px}
.stgrid{display:grid;grid-template-columns:repeat(4,61.51px);gap:21.81px;margin-top:28px}
.stgrid .dot{width:61.51px;height:61.51px}
.dot.me{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--title)}
.ringgrid .dot.me{box-shadow:0 0 0 3px #06060f,0 0 0 5px #a9a9b8}
.dot.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ringing */
.ringbg{background:#06060f;min-height:100dvh}
.fade{position:absolute;left:0;right:0;bottom:0;height:331px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 79.3%);z-index:0;pointer-events:none}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}

/* status */
.st{padding-left:35px;padding-right:35px}
.st-h{font:500 32px var(--rd);color:var(--title);line-height:42px;padding-top:0}
.count{display:flex;align-items:flex-end;gap:13px;margin-top:47px}
.count b{font:300 84px/1 var(--rnd);color:var(--ink)}
.count span{font:400 18px/23px var(--rd);color:var(--title);padding-bottom:6px}
.sect{margin-top:47px}
.sect+.sect{margin-top:43px}

/* avatars */
.dot.av{display:flex;align-items:center;justify-content:center;font:600 18px var(--sf);color:#1d1f34}
.stack .dot.av{font-size:19px;box-shadow:0 0 0 2px var(--bg)}
.ringgrid .dot.av{font-size:17px}
.stgrid .dot.av{font-size:22px}
.pp{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.pp span{font:400 13px var(--sf);color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stgrid{row-gap:16px}

/* dashboard */
.dash{padding-left:20px;padding-right:20px;padding-bottom:calc(env(safe-area-inset-bottom) + 30px);min-height:auto}
.dtop{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 30px}
.date{font:400 14px var(--sf);color:var(--sub)}
.hello{font:500 28px var(--sf);color:var(--title);margin-top:4px}
.card{display:block;width:100%;text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:24px;padding:18px 20px;margin-bottom:12px;color:var(--ink)}
.card.new{border-color:var(--line2);background:linear-gradient(160deg,#2a2c48,#15172b 70%)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card .label{font-size:15px}
.chipx{font:500 13px var(--sf);color:var(--btn);background:var(--line);border-radius:12px;padding:4px 10px}
.chipx.hot{background:#755972;color:#f3e6f0}
.card-t{font:500 20px var(--sf);color:var(--title);margin-top:6px}
.card-s{font:400 14px var(--sf);color:var(--sub);margin-top:3px}
.mini{display:flex;align-items:center;margin-top:14px}
.mini .dot{width:30px;height:30px;margin-left:-8px;font-size:13px;box-shadow:0 0 0 2px var(--deep)}
.mini .dot:first-child{margin-left:0}
.mini span{font:400 14px var(--sf);color:var(--sub);margin-left:10px}
.pill.sm{font-size:18px;line-height:24px;padding:9px 26px;margin-top:16px;align-self:flex-start;display:inline-block}
.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 6px;margin-top:16px}
.roster .dot{width:40px;height:40px;font-size:16px}
.roster .pp span{font-size:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.hrow-t{font:500 16px var(--sf);color:var(--title)}
.notif .appic{width:38px;height:38px;border-radius:10px;background:var(--up);color:#1d1f34;display:flex;align-items:center;justify-content:center;flex:none}
.notif em{font:400 13px var(--sf);color:var(--sub);font-style:normal;align-self:flex-start}
.backdrop{position:fixed;inset:0;overflow:hidden;filter:brightness(.45);pointer-events:auto}
.backdrop *{pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line2);border-radius:28px 28px 0 0;padding:12px 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;animation:up .3s ease-out;z-index:10;max-width:520px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center;margin-bottom:18px}
.sheet .pill{align-self:stretch;text-align:center}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}

/* home notification */
.addrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;font:400 15px var(--sf);color:#6a6d8f;text-align:left}
.addic{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--line2);color:#6a6d8f;display:flex;align-items:center;justify-content:center;flex:none}
.addrow:active .addic{background:var(--line)}
.scr>.dock{position:fixed !important;left:0;right:0;bottom:0;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(to bottom,rgba(29,31,52,0),var(--bg) 35%);display:flex;justify-content:center;z-index:8 !important;max-width:430px;margin:0 auto}
.dock .pill{padding:6px 34px;font-size:22px;line-height:30px}
.scr>.dock.col-dock{flex-direction:column;align-items:center;padding-top:40px;background:linear-gradient(to bottom,rgba(29,31,52,0),rgba(29,31,52,.92) 40%,#1d1f34 70%)}
.dock.col-dock .pill{padding:4px 72px;font-size:32px;line-height:38px}
.notif.ncol{flex-direction:column;align-items:stretch;cursor:pointer}
.notif.ncol b{white-space:normal;line-height:21px}
.nrow{display:flex;gap:12px;align-items:center;width:100%}
.notif .pill.sm{font-size:17px;padding:7px 24px}
.sec{margin:44px 4px 12px}
.empty{font:400 15px var(--sf);color:#56566c;padding:10px 4px 2px}
.scr>.fab{position:fixed !important;z-index:8 !important;right:max(20px,calc(50% - 240px));bottom:calc(env(safe-area-inset-bottom) + 24px);width:62px;height:62px;border-radius:50%;background:var(--btn);color:#1d1f34;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(6,6,15,.55);z-index:8;transition:transform .1s}
.fab:active{transform:scale(.94)}
.fab:disabled{opacity:.35}
.grow-row:disabled{opacity:1}
.grow-row{width:100%;gap:14px;justify-content:flex-start}
.reuse{flex:none;border:1px solid var(--line2);color:var(--btn);border-radius:18px;padding:7px 16px;font:500 15px var(--sf);margin-left:12px}
.reuse:active{background:var(--line)}
.reuse:disabled{opacity:.35}
.notif{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;margin-bottom:12px;border-radius:24px;background:var(--line);border:1px solid var(--line2);color:var(--btn)}
.notif b{display:block;font:500 16px var(--sf);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif small{display:block;font:400 14px var(--sf);color:var(--sub);margin-top:3px}
.notif.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{0%{transform:translateY(-12px) scale(.97);opacity:0}100%{transform:none;opacity:1}}

/* photo */
.cam{position:fixed;inset:0;background:#06060f;display:flex;flex-direction:column}
.cam-top{padding:calc(env(safe-area-inset-top) + 14px) 24px 14px;display:flex;align-items:center;justify-content:center;position:relative;min-height:70px}
.cam-x{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 8px);width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.cam-view{flex:1;position:relative;overflow:hidden;background:var(--deep);margin:0 16px;border-radius:24px}
.cam-view video,.cam-view img,.cam-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-bot{display:flex;justify-content:center;align-items:center;padding:24px 0 calc(env(safe-area-inset-bottom) + 24px);min-height:130px}
.shutter{width:82px;height:82px;border-radius:50%;border:3px solid var(--btn);padding:5px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--btn)}
.shutter:active i{transform:scale(.9)}
.okmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,6,15,.35)}
.okmark div{width:120px;height:120px;border-radius:50%;background:var(--up);display:flex;align-items:center;justify-content:center;animation:pop .4s;color:#1d1f34}

/* move */
.steps{display:flex;gap:12px}
.steps i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);transition:background .2s,transform .2s}
.steps i.on{background:linear-gradient(145deg,#c4e0cd,#86a993);border-color:transparent;transform:scale(1.15)}
.prog{width:100%;height:28px;background:var(--deep);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--up);border-radius:14px;transition:width .15s}
.wait{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.wait i{width:14px;height:14px;background:var(--sub);border-radius:50%;animation:breathe 1s infinite}

/* ===== playful bold theme ===== */
:root{--bg:#141416;--deep:#0c0c0e;--line:#26262b;--line2:#3a3a42;--ink:#ffffff;--ampm:#c9c7ff;--title:#ffffff;--sub:#a9a7d6;--ph:#8a88c0;--btn:#ffffff;
  --sleep:#e39a92;--snz:#ddd39a;--up:#8fc4a6;
  --blue:#454f86;--blue-d:#323a66;--coral:#8c566a;--coral-d:#6b4152;--yellow:#d8d5f3;--yellow-d:#a29dcf;--mint:#46705f;--mint-d:#345446;--violet:#5e5287;--violet-d:#463d66;--pink:#d8d5f3;--pink-d:#a29dcf;--plum:#5b4f86;--plum-d:#433a64;--k:#15142e}
.hello{font:800 32px var(--rnd);letter-spacing:-.5px;color:#fff}
.date{font:700 14px var(--rnd);color:#a9a5d8;letter-spacing:.3px}
.label.sec{font:800 13px var(--rnd);text-transform:uppercase;letter-spacing:1.6px;color:var(--sub)}
.head{font:800 20px var(--rnd);line-height:24px}
.st-h{font-family:var(--rnd);font-weight:800;color:#fff}
.label{font-family:var(--rnd);font-weight:700}
.time span:first-child{font-weight:600}

/* pills: chunky, pressable */
.pill{background:var(--yellow);color:var(--k);font-family:var(--rnd);font-weight:800;box-shadow:0 5px 0 var(--yellow-d);transition:transform .08s,box-shadow .08s}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-d)}
.link{font-family:var(--rnd);font-weight:700;color:var(--sub)}

/* upcoming alarm card: blue block */
.card{background:var(--blue);border:0;border-radius:28px;color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.card.new{background:var(--blue)}
.card .label{color:rgba(255,255,255,.85);font-size:15px}
.card-t{font:800 22px var(--rnd)}
.card .card-t{color:#fff}
.card .card-s,.card .mini span{color:rgba(255,255,255,.85)}
.card .time,.card .time .ap{color:#fff}
.card .mini .dot{box-shadow:0 0 0 2.5px var(--blue)}
.chipx{background:rgba(255,255,255,.16);color:#f3f2fb;font:800 13px var(--rnd)}
.card:active,.notif:active,.grow-row:active{transform:translateY(3px)}

/* invites: coral (alarm) and yellow (group) blocks */
.notif{border:0;border-radius:28px;background:var(--plum);color:#fff;box-shadow:0 5px 0 var(--plum-d)}
.notif b{font:800 17px var(--rnd);color:#f3f2fb}
.notif small,.notif em,.notif .card-s{color:rgba(243,242,251,.72)}
.notif .appic{background:rgba(255,255,255,.14);color:#f3f2fb;border-radius:12px}
.notif .pill{background:#f3f2fb;color:var(--plum);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.notif .mini .dot{box-shadow:0 0 0 2.5px var(--plum)}
.notif[data-act="invite"]{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.notif[data-act="invite"] b{color:#fff}
.notif[data-act="invite"] small,.notif[data-act="invite"] em,.notif[data-act="invite"] .card-s{color:rgba(255,255,255,.85)}
.notif[data-act="invite"] .appic{background:rgba(255,255,255,.14);color:#f3f2fb}
.notif[data-act="invite"] .pill{background:#f3f2fb;color:var(--coral)}

/* groups: mint blocks */
.grow-row{background:var(--mint);border:0 !important;border-radius:24px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--mint-d);transition:transform .08s}
.grow-row .hrow-t{font:800 18px var(--rnd);color:#f3f2fb}
.grow-row .card-s{color:rgba(243,242,251,.72)}
.grow-row img{filter:brightness(0) invert(1);opacity:.55}
.grow-row .mini .dot{box-shadow:0 0 0 2.5px var(--mint)}

/* recent: violet blocks */
.hrow:has(.reuse){background:var(--violet);border:0;border-radius:24px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--violet-d)}
.hrow:has(.reuse) .hrow-t{font:800 17px var(--rnd);color:#fff}
.hrow:has(.reuse) .card-s{color:rgba(255,255,255,.8)}
.reuse{background:rgba(255,255,255,.16);color:#f3f2fb;border:0;font:800 15px var(--rnd)}
.reuse:active{background:rgba(255,255,255,.26)}
.hrow{border-bottom-color:var(--line)}
.hrow-t{font-family:var(--rnd);font-weight:700}

/* empty state stays quiet */
.addrow{font-family:var(--rnd);font-weight:600}
.empty{font-family:var(--rnd);color:#5f5d8f}

/* FAB */
.scr>.fab{background:var(--pink);color:var(--k);box-shadow:0 5px 0 var(--pink-d),0 12px 26px rgba(0,0,0,.35)}
.fab:active{transform:translateY(3px)}

/* avatars: flat and bright */
.dot.av{font-family:var(--rnd);font-weight:800;color:var(--k)}

/* create screen */
.field{background:var(--deep);border:1px solid var(--line2);box-shadow:none}
.field input{color:#f3f2fb;font-family:var(--rnd);font-weight:700}
.field input::placeholder{color:#4a4878}
.sel{background:var(--blue);border:0;box-shadow:0 4px 0 var(--blue-d)}

<div id="app"></div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
// GitHub Pages lets browsers keep this page for 10 minutes. If a newer version is live, load it once.
(async () => {
  try {
    if (sessionStorage.getItem('tat-fresh') === location.search) return;
    const r = await fetch(location.pathname, { cache: 'no-store', method: 'HEAD' });
    const live = Date.parse(r.headers.get('last-modified') || ''), mine = Date.parse(document.lastModified);
    if (live && mine && live - mine > 2000) {
      const u = new URL(location.href); u.searchParams.set('v', String(live));
      sessionStorage.setItem('tat-fresh', u.search);
      location.replace(u.toString());
    }
  } catch (e) {}
})();
</script>
<script>
(() => {
/* ================= Constants ================= */
const TEAM_SIZE = 11, SNOOZE_MS = 30000, MAX_SNOOZE = 2, LEAD_MS = 15000;
const RING_STALE = 10 * 60e3, GONE_MS = 10 * 60e3, ONLINE_MS = 35000;
const FAKES = ['Maya', 'Jordan', 'Theo', 'Priya', 'Leo', 'Ava', 'Marcus', 'Nina', 'Sam', 'Kai', 'Zoe', 'Eli'];
const PHOTO_PROMPTS = ['Your toothbrush', 'Your shoes', 'Your sink', 'A light switch', 'A door handle', 'A towel', 'A window'];
const MOVE_TASKS = ['shake', 'walk'];
const STEPS = 5;
// Everyone is in IXD 415 (the class QR code links to ?group=ixd415, which lands in the same place).
const MY_GROUP = 'IXD 415';
const DEFAULTS = { name: 'Morning workout', team: MY_GROUP };
const STORE = 'team-alarm-tasks-v2';
try { localStorage.removeItem('team-alarm-tasks-v1'); } catch (e) {}
const ROOM = (new URLSearchParams(location.search).get('team') || 'ixd415-live').replace(/[^a-z0-9-]/gi, '').slice(0, 40) || 'ixd415-live';
const BASE = 'team-alarm-tasks-proto/' + ROOM;
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];

const I = {
  cam: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6"/></svg>`,
  up: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="8" height="13" rx="2"/><path d="M12 6V1M8.5 4.5L12 1l3.5 3.5"/></svg>`,
  shake: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M1 10v4M20 8v8M23 10v4"/></svg>`,
  check: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`,
  zz: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h7l-7 9h7M14 4h6l-6 7h6"/></svg>`,
  arrow: (s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  bell: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/></svg>`,
  plus: (s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  people: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.6"/><circle cx="17" cy="9.5" r="2.8"/><path d="M2.5 19.5c.6-3.6 3.3-5.6 6.5-5.6s5.9 2 6.5 5.6z"/><path d="M16 14.2c2.9-.3 5 1.4 5.5 4.6H17"/></svg>`,
  walk: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="4" r="2"/><path d="M11 21l2-6 3 3v4M9 12l2-4 4 1 2 4M11 8l-2 5-3 1"/></svg>`,
  x: (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (v, n) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, n);
const num = x => (typeof x === 'number' && isFinite(x) ? x : 0);

/* ================= Local state ================= */
let saved = {};
try { saved = JSON.parse(sessionStorage.getItem(STORE)) || {}; } catch (e) {}
const myKey = saved.key || 'p' + Math.random().toString(36).slice(2, 10);
let nick = clean(saved.nick, 20);
let myGroups = Array.isArray(saved.groups) ? saved.groups.filter(g => typeof g === 'string').slice(0, 8) : [];
// Each group has a color its creator picks; IXD 415 is pink.
const GROUP_COLORS = [['#8c4f78', '#6b3b5c'], ['#454f86', '#323a66'], ['#46705f', '#345446'], ['#5b4f86', '#433a64'], ['#3f6b78', '#2e505b'], ['#8a6a45', '#6a5034']];
let groupColors = saved.groupColors && typeof saved.groupColors === 'object' ? saved.groupColors : {};
const gcol = g => GROUP_COLORS[groupColors[g] != null ? groupColors[g] : (g === 'IXD 415' ? 0 : 1)] || GROUP_COLORS[0];
const gvars = g => { const c = gcol(g); return `--gc:${c[0]};--gd:${c[1]}`; };
let recent = Array.isArray(saved.recent) ? saved.recent.filter(x => x && typeof x === 'object').slice(0, 4) : [];
const blankMe = () => ({ gen: 0, joinedAt: 0, round: 0, status: 'asleep', snoozes: 0, snoozeUntil: 0, upAt: 0, declined: 0 });
let me = Object.assign(blankMe(), saved.me || {});
let alarm = cleanAlarm(saved.alarm);
const bootLast = num(saved.lastTs);
let resumed = false, heard = false;
const peers = new Map();       // key -> latest message from that phone
let ui = { sheet: nick ? null : 'first', groupInviteAt: 0, screen: '', view: 'home', task: null, draft: null, editMode: null, col: 'm', notifSeen: 0, lastHtml: '', prevStatus: {} };

function save() {
  try { sessionStorage.setItem(STORE, JSON.stringify({ key: myKey, nick, groups: myGroups, groupColors, recent, me, alarm, lastTs: resumed ? Date.now() : bootLast })); } catch (e) {}
}

/* ================= Alarm model ================= */
function cleanAlarm(a) {
  if (!a || typeof a !== 'object' || !(num(a.gen) > 0)) return null;
  const types = Array.isArray(a.types) ? a.types.filter(t => t === 'photo' || t === 'move') : [];
  return {
    gen: num(a.gen), v: num(a.v), t: num(a.t), creator: clean(a.creator, 40), by: clean(a.by, 20),
    name: clean(a.name, 40) || DEFAULTS.name, team: clean(a.team, 40) || DEFAULTS.team,
    hh: Math.min(23, Math.max(0, Math.round(num(a.hh)))), mm: Math.min(59, Math.max(0, Math.round(num(a.mm)))),
    tasks: a.tasks === true, types: types.length ? types : ['photo', 'move'],
    round: Math.max(1, num(a.round)), ringAt: num(a.ringAt), fakes: Math.min(TEAM_SIZE - 1, Math.max(0, num(a.fakes)))
  };
}
const newer = (a, b) => !!a && (!b || a.gen > b.gen || (a.gen === b.gen && (a.v > b.v || (a.v === b.v && a.t > b.t))));
function bump(patch) {
  alarm = Object.assign({}, alarm, patch, { v: alarm.v + 1, t: Date.now() });
}
function lastSeen(gen) {
  let last = 0;
  for (const p of peers.values()) if (p.key !== myKey && p.joined && p.gen === gen) last = Math.max(last, num(p.ts));
  if (me.gen === gen) last = Math.max(last, resumed ? Date.now() : bootLast);
  return last;
}
function expired(a, now = Date.now()) {
  if (!a) return true;
  if (a.ringAt && now - a.ringAt > RING_STALE) return true;
  return now - Math.max(lastSeen(a.gen), a.t) > GONE_MS;
}
function adopt(a) {
  if (!a || !newer(a, alarm) || expired(a)) return false;
  if (!alarm || a.gen !== alarm.gen) { me = blankMe(); ui.task = null; if (ui.editMode !== 'new') { ui.draft = null; ui.editMode = null; } ui.view = 'home'; }
  else if (a.round !== alarm.round) { me = Object.assign(blankMe(), { gen: me.gen, joinedAt: me.joinedAt }); ui.task = null; }
  alarm = a;
  return true;
}

/* ================= Sync (public MQTT, retained message per phone) ================= */
let client = null, live = false, brokerIx = 0, lastSent = '';
function payload() {
  return { key: myKey, nick, joined: !!alarm && me.gen === alarm.gen, gen: me.gen, joinedAt: me.joinedAt,
    round: me.round, status: me.status, snoozes: me.snoozes, snoozeUntil: me.snoozeUntil, upAt: me.upAt, alarm };
}
function publish(force) {
  save();
  const p = payload(), s = JSON.stringify(p);
  if (!force && s === lastSent) return;
  lastSent = s;
  if (live && nick) client.publish(BASE + '/p/' + myKey, JSON.stringify(Object.assign(p, { ts: Date.now() })), { retain: true, qos: 1 });
}
function connect() {
  if (!window.mqtt) { setTimeout(() => { heard = true; }, 300); return; }
  client = mqtt.connect(BROKERS[brokerIx], { connectTimeout: 8000, reconnectPeriod: 2500, clean: true, clientId: 'tat-' + Math.random().toString(36).slice(2, 12) });
  const fail = setTimeout(() => { if (!live) { client.end(true); brokerIx = (brokerIx + 1) % BROKERS.length; connect(); } }, 9000);
  client.on('connect', () => {
    clearTimeout(fail); live = true;
    client.subscribe(BASE + '/p/+', { qos: 1 }, () => setTimeout(() => { heard = true; publish(true); }, 1500));
  });
  client.on('close', () => { live = false; });
  client.on('message', (topic, buf) => {
    const key = topic.slice(topic.lastIndexOf('/') + 1);
    if (!buf || !buf.length) { peers.delete(key); return; }
    try {
      const p = JSON.parse(buf.toString());
      if (!p || typeof p !== 'object' || key === myKey) return;
      p.key = key;
      peers.set(key, p);
      if (adopt(cleanAlarm(p.alarm))) publish();
    } catch (e) {}
  });
}
setTimeout(() => { heard = true; }, 12000);     // no broker at all: carry on solo
setInterval(() => publish(true), 10000);        // heartbeat
window.addEventListener('pagehide', e => { if (!e.persisted && live && client) try { client.publish(BASE + '/p/' + myKey, '', { retain: true, qos: 0 }); } catch (x) {} });

/* ================= Team ================= */
function rand(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ringing = (now = Date.now()) => !!alarm && alarm.ringAt > 0 && now >= alarm.ringAt;
function myStatus(now = Date.now()) {
  if (!ringing(now) || me.round !== alarm.round) return 'asleep';
  if (me.status === 'snoozed' && now >= me.snoozeUntil) return 'asleep';
  return me.status;
}
function realPeers(now) {
  const out = [];
  for (const p of peers.values()) {
    if (!p.joined || p.gen !== alarm.gen) continue;
    const online = now - num(p.ts) < ONLINE_MS;
    const inRound = alarm.ringAt && p.round === alarm.round;
    if (!online && !inRound) continue;
    out.push(p);
  }
  return out.sort((a, b) => num(a.joinedAt) - num(b.joinedAt));
}
function fakeState(i, now) {
  const t = (now - alarm.ringAt) / 1000;
  const r = rand(alarm.gen % 100000 * 31 + alarm.round * 977 + i * 131);
  const upAt = 3 + r() * 25;                     // everyone simulated is up within ~30 s
  const snoozer = r() < 0.3, snoozeAt = 1.5 + r() * 2;
  const upMs = alarm.ringAt + upAt * 1000;
  if (t >= upAt) return { status: 'up', upAt: upMs, snoozes: snoozer ? 1 : 0 };
  if (snoozer && t >= snoozeAt) return { status: 'snoozed', snoozes: 1 };
  return { status: 'asleep', snoozes: 0 };
}
function computeTeam(now = Date.now()) {
  const list = [];
  const live = ringing(now);
  if (me.gen === alarm.gen) list.push({ key: myKey, me: true, name: nick || 'You', status: myStatus(now), snoozes: me.snoozes, upAt: me.upAt, joinedAt: me.joinedAt });
  for (const p of realPeers(now)) {
    let status = 'asleep', snoozes = 0, upAt = 0;
    if (live && p.round === alarm.round) {
      status = p.status === 'up' || p.status === 'snoozed' ? p.status : 'asleep';
      if (status === 'snoozed' && now >= num(p.snoozeUntil)) status = 'asleep';
      snoozes = num(p.snoozes); upAt = num(p.upAt);
    }
    list.push({ key: p.key, name: clean(p.nick, 20) || 'Teammate', status, snoozes, upAt, joinedAt: num(p.joinedAt) });
  }
  list.sort((a, b) => a.joinedAt - b.joinedAt);
  const nFake = Math.max(0, TEAM_SIZE - list.length - (me.gen === alarm.gen ? 0 : 1));
  for (let i = 0; i < nFake; i++) {
    const f = live ? fakeState(i, now) : { status: 'asleep', snoozes: 0 };
    list.push(Object.assign({ key: 'f' + i, fake: true, name: FAKES[i % FAKES.length] }, f));
  }
  return list;
}
const allUp = team => team.length > 0 && team.every(p => p.status === 'up');
function todaysTask() {
  const r = rand(alarm.gen % 100000 + alarm.round * 7919);
  const type = alarm.types[Math.floor(r() * alarm.types.length)];
  if (type === 'photo') return { type, prompt: PHOTO_PROMPTS[Math.floor(r() * PHOTO_PROMPTS.length)] };
  return { type, move: MOVE_TASKS[Math.floor(r() * MOVE_TASKS.length)] };
}
function clockAt(offsetSec) {
  let t = alarm.hh * 3600 + alarm.mm * 60 + Math.floor(offsetSec);
  t = ((t % 86400) + 86400) % 86400;
  const H = Math.floor(t / 3600), M = Math.floor(t / 60) % 60;
  return { hm: (H % 12 || 12) + ':' + String(M).padStart(2, '0'), ss: String(t % 60).padStart(2, '0'), ap: H >= 12 ? 'PM' : 'AM' };
}
function soon() { const d = new Date(Date.now() + 180000); return { hh: d.getHours(), mm: d.getMinutes() }; }
function nextAt(hh, mm) { const d = new Date(); d.setHours(hh, mm, 0, 0); if (d.getTime() <= Date.now() + 1000) d.setDate(d.getDate() + 1); return d.getTime(); }
function until() {
  const s = Math.max(0, Math.ceil((alarm.ringAt - Date.now()) / 1000));
  if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor(s / 60) % 60 + 'm';
  if (s >= 60) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return s + 's';
}
const doneKey = () => alarm ? alarm.gen + ':' + alarm.round : '';
const joinedNow = () => !!alarm && me.gen === alarm.gen;
const activeAlarm = () => !!alarm && !(alarm.ringAt && Date.now() >= alarm.ringAt && !joinedNow());
// An invite shows on the home screen for alarms in my group I haven't answered yet, until it rings.
const invited = () => !!alarm && myGroups.includes(alarm.team) && alarm.creator !== myKey && !joinedNow() && me.declined !== alarm.gen && !(alarm.ringAt && Date.now() >= alarm.ringAt);
function draftFrom(a, time) { return { name: a.name, team: a.team, hh: time.hh, mm: time.mm, tasks: a.tasks, types: a.types.slice() }; }
const sz = (hm, short, long) => (hm.length > 4 ? long : short) + 'px';
const fmt = (hh, mm) => ({ hm: (hh % 12 || 12) + ':' + String(mm).padStart(2, '0'), ap: hh >= 12 ? 'PM' : 'AM' });

/* ================= Sound, buzz, screen ================= */
let audio = null, lastBeep = 0, wakeLock = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
}
function tone(loud) {
  if (!audio || audio.state !== 'running') return;
  const t = audio.currentTime;
  const seq = loud ? [[0, 880], [0.14, 1175], [0.28, 880], [0.42, 1175]] : [[0, 880], [0.16, 1175]];
  seq.forEach(([d, f]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = loud ? 'square' : 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(loud ? 0.22 : 0.12, t + d + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.12);
    o.connect(g); g.connect(audio.destination); o.start(t + d); o.stop(t + d + 0.13);
  });
}
function keepAwake() {
  if (wakeLock || !navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me.gen) keepAwake(); });
document.addEventListener('pointerdown', () => { unlockAudio(); if (me.gen) keepAwake(); }, { capture: true });

/* ================= Roster + history (home) ================= */
function roster() {
  const now = Date.now(), list = [];
  if (nick) list.push({ key: myKey, me: true, name: nick });
  for (const p of peers.values()) if (now - num(p.ts) < ONLINE_MS && clean(p.nick, 20)) list.push({ key: p.key, name: clean(p.nick, 20) });
  for (let i = 0; list.length < TEAM_SIZE; i++) list.push({ key: 'f' + i, fake: true, name: FAKES[i % FAKES.length] });
  return list;
}
// Recent alarms: ones this phone set or joined (each row has what "Reuse" needs to prefill Create).
function history() {
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const dayName = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); const n = Math.round((day0 - d) / 864e5);
    return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday: 'short' }); };
  // Only alarms that have already gone off count as recent.
  return recent.filter(x => x.at <= Date.now()).map(x => Object.assign({}, x, { day: dayName(x.at) }));
}
function remember(a) {
  recent = [{ name: a.name, team: a.team, hh: a.hh, mm: a.mm, tasks: a.tasks, types: a.types.slice(), at: a.ringAt || Date.now() }]
    .concat(recent.filter(x => !(x.name === a.name && x.team === a.team && x.hh === a.hh && x.mm === a.mm))).slice(0, 4);
  save();

const timeBig = (hh, mm, size) => { const t = fmt(hh, mm); return `<span>${t.hm}</span><span class="ap">${t.ap}</span>`; };
const tsz = hm => (hm.length > 4 ? 108 : 132);

const initial = p => esc((p.name || '?').trim()[0] || '?').toUpperCase();

  if (!colors) return `<i class="dot av" style="background:${personColor(p.name)};position:relative;z-index:${5 - i}">${initial(p)}</i>`;
  return `<i class="dot av ${p.me ? 'me' : ''}" data-k="${p.key}" style="background:${colors[p.status]}">${initial(p)}</i>`;
}

function stack(team) {
  const shown = team.slice(0, 3), more = team.length - shown.length;
  return `<div class="stack">${shown.map((p, i) => dot(p, null, i)).join('')}</div>${more > 0 ? `<div class="more">+ ${more} more</div>` : ''}`;
}

// Time picker: two wheels. Swipe to roll by 1; the arrows nudge by 1.
const PITCH = 88;                                   // distance between numbers on a wheel
const wheel = { h: { off: 0 }, m: { off: 0 }, anim: null };
const pad2 = n => String(n).padStart(2, '0');
function wheelVal(col, k) {                          // value k rows above (+) or below (-) the center
  const d = ui.draft;
  if (col === 'h') { const H = d.hh % 12 || 12; return String(((H - 1 + k) % 12 + 12) % 12 + 1); }
  return pad2(((d.mm + k) % 60 + 60) % 60);
}
function stripHtml(col) {
  const off = wheel[col].off;
  let h = '';
  for (let k = -2; k <= 2; k++) h += `<span class="it ${k ? 'nb' : 'd'}" style="transform:translateY(${26 - k * PITCH + off}px)">${wheelVal(col, k)}</span>`;
  return h;
}
function pickerHtml(d) {
  const on = ui.col || 'm';
  const col = k => `<div class="col-wrap ${on === k ? 'on' : ''} ${k === 'h' && wheelVal('h', 0).length === 1 ? 'one' : ''}">

  return `${col('h')}<span class="colon">:</span>${col('m')}
    <div class="ap-col"><button data-ap="pm" class="${d.hh >= 12 ? 'on' : ''}">PM</button><button data-ap="am" class="${d.hh < 12 ? 'on' : ''}">AM</button></div>`;
}

          <div id="mvHint" class="card-s" style="margin-top:14px;font-size:15px;color:var(--snz);min-height:20px"></div></div>
        ${shake ? `<div class="prog"><i id="mv" style="width:0%"></i></div><div id="mvN" style="font:300 40px var(--rnd);color:var(--ink)">0%</div>`
          : `<div class="time" id="mvN" style="font-size:132px">0</div><div class="steps" id="mvDots">${'<i></i>'.repeat(STEPS)}</div>`}
      </div>
    </div>`;
  },
};

/* ================= Screen logic ================= */
function screenFor(team, now) {
  if (ui.sheet) return 'name';
  if (ui.newGroup) return 'newgroup';
  if (ui.editMode && ui.draft) return 'create';
  if (!alarm) return ui.view === 'group' ? 'group' : 'home';
  const joined = me.gen === alarm.gen;
  if (!joined || !alarm.ringAt || now < alarm.ringAt) {
    if (ui.view === 'invite' && !joined && !(alarm.ringAt && now >= alarm.ringAt)) return 'join';
    if (ui.view === 'lobby' && joined) return 'lobby';
    if (ui.view === 'group') return 'group';
    return 'home';
  }
  if (allUp(team)) return ui.closed === doneKey() ? (ui.view === 'group' ? 'group' : 'home') : 'done';
  const st = myStatus(now);
  if (st === 'snoozed') return ui.task || 'snooze';
  if (st !== 'asleep') return 'status';
  if (ui.task) return ui.task;
  return 'ring';
}
const STABLE = new Set(['name', 'newgroup', 'create', 'photo', 'move']);

function tick() {
  const now = Date.now();
  if (heard && !resumed) {
    resumed = true;
    if (alarm && expired(alarm, now)) { alarm = null; me = blankMe(); }
    publish(true);
  }
  if (alarm && resumed && expired(alarm, now)) { alarm = null; me = blankMe(); ui.task = null; publish(); }
  if (me.status === 'snoozed' && now >= me.snoozeUntil) { me.status = 'asleep'; publish(); }
  const team = alarm ? computeTeam(now) : [];
  const screen = screenFor(team, now);
  if (screen !== 'photo' && screen !== 'move') stopTask();
  let html = null;
  if (screen !== ui.screen || !STABLE.has(screen)) html = views[screen](team);
  if (html !== null && (screen !== ui.screen || html !== ui.lastHtml)) {
    $app.innerHTML = html; ui.lastHtml = html;
    if (screen !== ui.screen) { window.scrollTo(0, 0); onEnter(screen); }
    ui.screen = screen;
    // Tiles that just changed state get a little pop.
    team.forEach(p => { if (ui.prevStatus[p.key] && ui.prevStatus[p.key] !== p.status) { const el = $app.querySelector(`[data-k="${p.key}"]`); if (el) el.classList.add('pop'); } });
  }
  team.forEach(p => { ui.prevStatus[p.key] = p.status; });
  // Sound: loud while it's ringing for me; softer while I'm up but teammates still sleep.
  const inIt = joinedNow();
  const mine = inIt && ringing(now) && !allUp(team) && myStatus(now) === 'asleep';
  const others = inIt && ringing(now) && !allUp(team) && myStatus(now) !== 'snoozed' && team.some(p => p.status === 'asleep');
  // New invite: soft chime once; the banner's drop-in plays once per alarm.
  if (screen === 'home' && invited() && ui.notifSeen !== alarm.gen) { ui.notifSeen = alarm.gen; tone(false); if (navigator.vibrate) navigator.vibrate(60); }
  if (mine && now - lastBeep >= 1000) { lastBeep = now; tone(true); if (navigator.vibrate) navigator.vibrate([400, 200, 400]); }
  else if (!mine && others && now - lastBeep >= 2000) { lastBeep = now; tone(false); }
  if (screen === 'move') moveTick(now);
}

function onEnter(screen) {
  document.body.style.background = screen === 'ring' || screen === 'snooze' || screen === 'photo' ? '#06060f' : '#141416';
  if (screen === 'newgroup') { const f = document.getElementById('groupForm'), inp = document.getElementById('groupIn'), go = document.getElementById('groupGo');
    const upd = () => { go.disabled = !clean(inp.value, 30); }; inp.addEventListener('input', upd);
    setTimeout(() => inp.focus(), 250);
    let pick = 0;
    f.addEventListener('click', e => { const b = e.target.closest('[data-gc]'); if (!b) return; pick = +b.dataset.gc; f.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
    f.addEventListener('submit', e => { e.preventDefault(); const v = clean(inp.value, 30); if (!v) return;
      if (!myGroups.includes(v)) myGroups.push(v); groupColors[v] = pick; ui.newGroup = false; publish(true); tick(); }); }
  if (screen === 'name') { const f = document.getElementById('nameForm'), inp = document.getElementById('nameIn'), go = document.getElementById('nameGo');
    const upd = () => { go.disabled = !clean(inp.value, 20); }; upd(); inp.addEventListener('input', upd);
    setTimeout(() => inp.focus(), 250);
    f.addEventListener('submit', e => { e.preventDefault(); const v = clean(inp.value, 20); if (!v) return; unlockAudio(); nick = v; const act = ui.sheet; ui.sheet = null; if (!myGroups.includes(MY_GROUP)) ui.groupInviteAt = Date.now() + 1500; publish(true); doAct(act); tick(); }); }
  if (screen === 'create') {
    document.getElementById('anName').addEventListener('input', e => { ui.draft.name = e.target.value; });
    const sel = document.getElementById('sel');
    document.getElementById('selBtn').addEventListener('click', () => sel.classList.toggle('open'));
    sel.querySelectorAll('[data-g]').forEach(o => o.addEventListener('click', () => {
      ui.draft.team = o.dataset.g;
      document.getElementById('selTxt').textContent = o.dataset.g;
      document.getElementById('selBtn').classList.add('has');
      sel.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === o));
      sel.classList.remove('open');
    }));
    wirePicker();
  }
  if (screen === 'photo') startCamera();
  if (screen === 'move') startMotion();
}

/* ================= Time picker ================= */
// Move a wheel one notch: +1 is the number above (higher), -1 the one below.
function shiftWheel(col, dir, byOne) {
  const d = ui.draft;
  if (col === 'h') { const pm = d.hh >= 12; d.hh = (+wheelVal('h', dir) % 12) + (pm ? 12 : 0); }
  else d.mm = byOne ? (d.mm + dir + 60) % 60 : +wheelVal('m', dir);
}
function paintWheel(col) {
  const el = document.getElementById('col-' + col); if (!el) return;
  el.innerHTML = stripHtml(col);
  if (col === 'h') el.parentNode.classList.toggle('one', wheelVal('h', 0).length === 1);
}
function settle(col, off) {                           // fold whole notches into the value, keep the remainder
  while (off > PITCH / 2) { shiftWheel(col, 1); off -= PITCH; }
  while (off < -PITCH / 2) { shiftWheel(col, -1); off += PITCH; }
  return off;
}
function animateWheel(col, target, fold = true) {     // glide (with notches passing by) to a resting spot
  cancelAnimationFrame(wheel.anim);
  const w = wheel[col];
  const step = () => {
    w.off += (target - w.off) * 0.18;
    if (Math.abs(target - w.off) < 0.6) w.off = target;
    if (fold) { const folded = settle(col, w.off); target += folded - w.off; w.off = folded; }
    paintWheel(col);
    if (w.off !== target) wheel.anim = requestAnimationFrame(step);
    else { w.off = 0; paintWheel(col); }
  };
  wheel.anim = requestAnimationFrame(step);
}
function nudge(col, dir) {                            // arrows: by 1, sliding in from the side it came from
  cancelAnimationFrame(wheel.anim);
  shiftWheel(col, dir, true);
  wheel[col].off = 0;
  paintWheel(col);
}
function selectCol(col) {
  if (ui.col === col) return;
  ui.col = col;
  document.getElementById('picker').innerHTML = pickerHtml(ui.draft);
}
// Tapping anywhere outside the time picker clears the highlighted column.
document.addEventListener('pointerdown', e => {
  const pk = document.getElementById('picker');
  if (!pk || pk.contains(e.target) || ui.col === 'none') return;
  ui.col = 'none';
  pk.innerHTML = pickerHtml(ui.draft);
}, true);
function wirePicker() {
  const pk = document.getElementById('picker');
  let drag = null;
  pk.addEventListener('click', e => {
    const ap = e.target.closest('[data-ap]');
    if (ap) { const d = ui.draft; d.hh = (d.hh % 12) + (ap.dataset.ap === 'pm' ? 12 : 0); pk.innerHTML = pickerHtml(d); return; }
    const ch = e.target.closest('.chev');
    if (ch) nudge(ui.col || 'm', ch.classList.contains('up') ? 1 : -1);
  });
  // Pressed look for the arrows (iOS doesn't show :active without this).
  pk.addEventListener('pointerdown', e => { const ch = e.target.closest('.chev'); if (ch) ch.classList.add('press'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => pk.addEventListener(t, () => pk.querySelectorAll('.chev.press').forEach(c => c.classList.remove('press'))));
  pk.addEventListener('click', () => {
  });
  pk.addEventListener('pointerdown', e => {
    const c = e.target.closest('[data-col]'); if (!c) return;
    cancelAnimationFrame(wheel.anim);
    const col = c.dataset.col;
    selectCol(col);
    wheel[col].off = settle(col, wheel[col].off);
    drag = { col, y: e.clientY, t: performance.now(), v: 0, id: e.pointerId };
    try { pk.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  pk.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now(), dy = e.clientY - drag.y, dt = Math.max(1, now - drag.t);
    drag.v = drag.v * 0.6 + (dy / dt) * 0.4;           // px per ms, smoothed
    drag.y = e.clientY; drag.t = now;
    const w = wheel[drag.col];
    w.off = settle(drag.col, w.off + dy);
    paintWheel(drag.col);
  });
  const end = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const col = drag.col, w = wheel[col];
    const v = Math.max(-3, Math.min(3, drag.v));       // flick carries a few notches
    const coast = Math.abs(v) > 0.25 ? v * 220 : 0;
    drag = null;
    animateWheel(col, Math.round((w.off + coast) / PITCH) * PITCH);
  };
  pk.addEventListener('pointerup', end); pk.addEventListener('pointercancel', end);
}

/* ================= Actions ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  unlockAudio();
  const act = b.dataset.act;
  // First join or create asks for a first name, then carries on.
  if (!nick && ['join', 'new', 'group', 'reuse'].includes(act)) { ui.bgHtml = ui.lastHtml; ui.sheet = act; ui.sheetData = Object.assign({}, b.dataset); tick(); return; }
  if (act === 'unsheet') { if (ui.sheet !== 'first') ui.sheet = null; ui.newGroup = false; tick(); return; }
  doAct(act, b);
  tick();
});
function doAct(act, b) {
  const now = Date.now(), data = b ? b.dataset : (ui.sheetData || {});
  switch (act) {
    case 'tasks': ui.draft.tasks = !ui.draft.tasks; rerender(); break;
    case 'type': {
      ui.draft.types = [b.dataset.v];               // one task type: photo or move
      rerender(); break;
    }
    case 'create': {
      const d = ui.draft, ringAt = nextAt(d.hh, d.mm);
      const fields = { name: clean(d.name, 40) || DEFAULTS.name, team: d.team || MY_GROUP, hh: d.hh, mm: d.mm, tasks: d.tasks, types: d.types, ringAt };
      if (ui.editMode === 'edit' && alarm) bump(fields);
      else if (ui.editMode === 'next' && alarm) { bump(Object.assign(fields, { round: alarm.round + 1 })); me = Object.assign(blankMe(), { gen: me.gen, joinedAt: me.joinedAt }); }
      else {
        alarm = cleanAlarm(Object.assign({ gen: now * 1000 + Math.floor(Math.random() * 1000), v: 1, t: now, creator: myKey, by: nick, round: 1 }, fields));
        me = Object.assign(blankMe(), { gen: alarm.gen, joinedAt: now });
      }
      remember(alarm); ui.draft = null; ui.editMode = null; ui.view = 'lobby'; keepAwake(); publish(); break;
    }
    case 'opengroup': ui.groupName = data.g; ui.view = 'group'; break;
    case 'newgroup': ui.bgHtml = ui.lastHtml; ui.newGroup = true; break;
    case 'close': ui.closed = doneKey(); ui.view = 'home'; break;
    case 'accept': if (!myGroups.includes(MY_GROUP)) myGroups.push(MY_GROUP); publish(true); break;
    case 'new': case 'group': ui.draft = { name: '', team: act === 'group' ? data.g : (myGroups[0] || ''), hh: soon().hh, mm: soon().mm, tasks: true, types: ['photo'] }; ui.editMode = 'new'; ui.col = 'none'; break;
    case 'reuse': { const x = history()[+data.i]; if (!x) break;
      ui.draft = { name: x.name, team: x.team, hh: x.hh, mm: x.mm, tasks: !!x.tasks, types: (x.types || ['photo', 'move']).slice() }; ui.editMode = 'new'; ui.col = 'none'; break; }
    case 'home': ui.view = 'home'; break;
    case 'invite': ui.view = 'invite'; break;
    case 'open': ui.view = 'lobby'; break;
    case 'decline': me.declined = alarm.gen; publish(); break;
    case 'undecline': me.declined = 0; publish(); break;
    case 'leave': me = blankMe(); ui.view = 'home'; publish(); break;
    case 'edit': if (alarm.creator !== myKey) break; ui.draft = draftFrom(alarm, { hh: alarm.hh, mm: alarm.mm }); ui.editMode = 'edit'; break;
    case 'next': ui.draft = draftFrom(alarm, soon()); ui.editMode = 'next'; break;
    case 'cancel': ui.draft = null; ui.editMode = null; break;
    case 'join': me = Object.assign(blankMe(), { gen: alarm.gen, joinedAt: now }); remember(alarm); ui.view = data.stay ? 'home' : 'lobby'; keepAwake(); publish(); break;
    case 'snooze':
      if (me.snoozes >= MAX_SNOOZE) break;
      Object.assign(me, { round: alarm.round, status: 'snoozed', snoozes: me.snoozes + 1, snoozeUntil: now + SNOOZE_MS });
      publish(); break;
    case 'off': wakeUp(); break;
    case 'task': {
      const task = todaysTask();
      if (task.type === 'move') askMotion();
      ui.task = task.type; break;
    }
    case 'back': ui.task = null; break;
    case 'shoot': shoot(); break;
  }
}
function rerender() {                                // redraw in place: stay where you were scrolled on the same screen
  const y = window.scrollY, was = ui.screen;
  ui.screen = ''; tick();
  if (ui.screen === was) window.scrollTo(0, y);
}
function wakeUp() {
  Object.assign(me, { round: alarm.round, status: 'up', upAt: Date.now() });
  ui.task = null; publish();
}

/* ================= Photo task ================= */
let stream = null, shot = false;
function startCamera() {
  shot = false;
  const vid = document.getElementById('vid');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(s => { if (ui.screen !== 'photo') { s.getTracks().forEach(t => t.stop()); return; } stream = s; vid.srcObject = s; vid.play().catch(() => {}); })
    .catch(() => { stream = null; });
  const fi = document.getElementById('fileIn');
  fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    const img = new Image(); img.src = URL.createObjectURL(f);
    document.getElementById('camView').innerHTML = ''; document.getElementById('camView').appendChild(img);
    finishPhoto();
  });
}
function shoot() {
  if (shot) return;
  const vid = document.getElementById('vid');
  if (!stream || !vid || !vid.videoWidth) { document.getElementById('fileIn').click(); return; }
  const c = document.createElement('canvas'); c.width = vid.videoWidth; c.height = vid.videoHeight;
  c.getContext('2d').drawImage(vid, 0, 0);
  const view = document.getElementById('camView'); view.innerHTML = ''; view.appendChild(c);
  stopTask();
  finishPhoto();
}
function finishPhoto() {
  shot = true;
  const view = document.getElementById('camView');
  view.insertAdjacentHTML('beforeend', `<div class="okmark"><div style="color:#0b0b0c">${I.check(64)}</div></div>`);
  setTimeout(wakeUp, 900);
}

/* ================= Movement task ================= */
const freshMotion = () => ({ prog: 0, shake: 0, last: 0, sensed: 0, holding: false, beta: null, held: 0, steps: 0, lp: 9.8, armed: true, lastStep: 0, done: false, lastT: Date.now(), start: Date.now() });
let motion = freshMotion();
function askMotion() {
  // iPhone asks for motion access, and only from a tap.
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {}
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
}
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  motion.sensed = Date.now();
  const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  const now = Date.now();
  if (Math.abs(mag - 9.8) > 9 && now - motion.last > 140) { motion.last = now; motion.shake = Math.min(1, motion.shake + 0.045); }
  motion.lp = motion.lp * 0.75 + mag * 0.25;          // smooth out jitter
  if (motion.armed && motion.lp > 11.3 && now - motion.lastStep > 300) { motion.steps++; motion.lastStep = now; motion.armed = false; }
  else if (motion.lp < 9.9) motion.armed = true;
}
function onOrient(e) { if (e.beta == null) return; motion.sensed = Date.now(); motion.beta = e.beta; }
const onDown = () => { motion.holding = true; }, onUp = () => { motion.holding = false; };
function startMotion() {
  motion = freshMotion();
  window.addEventListener('devicemotion', onMotion);
  window.addEventListener('deviceorientation', onOrient);
  const scr = document.getElementById('moveScr');
  scr.addEventListener('pointerdown', onDown); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
}
function stopTask() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  window.removeEventListener('devicemotion', onMotion);
  window.removeEventListener('deviceorientation', onOrient);
  window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);
}
function moveTick(now) {
  if (motion.done) return;
  const task = todaysTask();
  const dt = Math.min(0.5, (now - motion.lastT) / 1000); motion.lastT = now;
  // Without sensors (or if access was declined), pressing and holding the screen does the job.
  const noSensor = !motion.sensed && now - motion.start > 2500;
  const hint = document.getElementById('mvHint');
  if (hint && noSensor && !hint.textContent) hint.textContent = 'No motion sensor? Press and hold the screen instead';
  const bar = document.getElementById('mv'), n = document.getElementById('mvN');
  if (task.move === 'shake') {
    if (motion.holding) motion.shake = Math.min(1, motion.shake + dt / 3);
    motion.prog = motion.shake;
    if (bar) bar.style.width = Math.round(motion.prog * 100) + '%';
    if (n) n.textContent = Math.round(motion.prog * 100) + '%';
  } else {
    if (motion.holding) motion.held += dt;               // holding the screen: a step every 0.6 s
    const steps = Math.min(STEPS, motion.steps + Math.floor(motion.held / 0.6));
    motion.prog = steps / STEPS;
    if (n && n.textContent !== String(steps)) { n.textContent = steps; if (steps && navigator.vibrate) navigator.vibrate(30); }
    const dots = document.getElementById('mvDots');
    if (dots) [...dots.children].forEach((d, i) => d.classList.toggle('on', i < steps));
  }
  if (motion.prog >= 1) {
    motion.done = true;
    if (n) n.innerHTML = I.check(task.move === 'shake' ? 40 : 110);
    if (navigator.vibrate) navigator.vibrate(80);
    setTimeout(wakeUp, 700);
  }
}

/* ================= Go ================= */
connect();
setInterval(tick, 250);
tick();
})();
</script>
</body>
