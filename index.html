<script>
// GitHub Pages lets browsers keep this page for 10 minutes. If a newer version is live, load it once.
(async () => {
  try {
    if (sessionStorage.getItem('tat-fresh') === location.search) return;
    const r = await fetch(location.pathname, { cache: 'no-store', method: 'HEAD' });
    const live = Date.parse(r.headers.get('last-modified') || ''), mine = Date.parse(document.lastModified);
    if (live && mine && live - mine > 2000) {
      const u = new URL(location.href); u.searchParams.set('v', String(live));
      sessionStorage.setItem('tat-fresh', u.search);
      location.replace(u.toString());
    }
  } catch (e) {}
})();
</script>
<style>
:root{--blue:#4f8cff;--lime:#a6efc6;--purple:#6fb7ff;--navy:#12304a;--white:#fff;--bg:#e6f0f8;--card:rgba(255,255,255,.58);--muted:rgba(18,48,74,.6);--line:rgba(18,48,74,.08);--faint:rgba(18,48,74,.4);--red:#ff5d7d;

/* desktop: the app sits inside a phone */

html.framed{--sh:852px;--safe-t:54px;--safe-b:26px}
html.framed #stage{height:100%;display:flex;align-items:center;justify-content:center;gap:72px}
html.framed .phone{position:relative;flex:none;width:393px;height:852px;border-radius:58px;background:var(--grad);overflow:hidden;transform:translateZ(0) scale(var(--k,1));margin:calc(426px * (var(--k,1) - 1)) calc(196px * (var(--k,1) - 1));
  box-shadow:0 0 0 10px rgba(255,255,255,.55),0 0 0 11px rgba(255,255,255,.9),0 0 0 12px rgba(18,48,74,.08),0 50px 90px -20px rgba(30,70,130,.35);transition:background .3s}

html.framed #sbar{display:flex;position:absolute;top:0;left:0;right:0;height:52px;z-index:35;align-items:center;justify-content:space-between;padding:6px 34px 0 52px;font:600 17px var(--sys);letter-spacing:-.2px;color:var(--navy);background:transparent;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent);transition:color .3s;pointer-events:none}

html.framed .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#0d1a2a;z-index:72;pointer-events:none}
html.framed .homebar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--navy);z-index:72;pointer-events:none;opacity:.9;transition:background .3s}
html.framed .scr{max-width:none}
.hero-art{display:flex;justify-content:center;align-items:center;position:relative}
.hero-art svg{position:relative;z-index:1;width:min(56%,210px);height:auto;filter:drop-shadow(0 24px 40px rgba(40,90,160,.18))}

/* phone sign-in */
.field .cc{font:500 20px var(--f);color:var(--muted);margin-right:10px;padding-right:12px;border-right:1px solid var(--line)}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

.otp i.cur{border-color:var(--navy)}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;-webkit-user-select:text;user-select:text}
#banner .appic.msg{background:linear-gradient(#5ff777,#2bd34d)}
/* notification banner */
#banner{position:fixed;left:10px;right:10px;max-width:410px;margin:0 auto;top:calc(var(--safe-t) + 4px);z-index:80;display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:24px;background:rgba(250,250,253,.86);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:0 12px 34px rgba(1,20,60,.22);transform:translateY(calc(-100% - var(--safe-t) - 20px));transition:transform .45s cubic-bezier(.2,.9,.25,1.1),visibility 0s .45s;visibility:hidden;cursor:pointer;text-align:left;color:var(--navy)}

.ctbtn{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);border-radius:24px;padding:14px 16px;transition:transform .12s}

.ctic{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5b8cff,#5fd3c5);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

.alert .at{padding:19px 16px 15px}.alert b{display:block;font:600 17px/1.3 var(--sys);color:#000}.alert span{display:block;font:400 13px/1.35 var(--sys);color:#000;margin-top:4px}
.ab{display:flex;border-top:.5px solid rgba(60,60,67,.3)}

.ab button+button{border-left:.5px solid rgba(60,60,67,.3)}

.tog{width:51px;height:31px;border-radius:16px;background:rgba(18,48,74,.15);position:relative;flex:none;transition:background .2s;margin-left:auto}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .2s}
.tog.on{background:#4f8cff}.tog.on::after{transform:translateX(20px)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);border-radius:22px;padding:14px 8px;text-align:center}
.kpis b{display:block;font:600 26px var(--f);font-variant-numeric:tabular-nums}.kpis small{font:500 12px var(--f);color:var(--muted)}
.feed .lrow small{display:block}
.when{font:500 12px var(--f);color:var(--faint);white-space:nowrap;align-self:flex-start;margin-top:3px}
.rank{width:22px;font:600 14px var(--f);color:var(--faint);text-align:center;flex:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{color:var(--navy);font-family:var(--f);overscroll-behavior:none}
html{background:var(--grad);background-attachment:fixed;min-height:100%}
body{background:transparent}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
#app{min-height:var(--sh)}
.scr{min-height:var(--sh);max-width:430px;margin:0 auto;padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 120px);position:relative}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
/* type */
.date{font:500 15px var(--f);color:var(--muted)}
.hi{font:600 34px/1.1 var(--f);margin-top:4px;letter-spacing:-.4px;color:#fff;text-shadow:0 2px 24px rgba(40,100,200,.35)}

.sub{font:500 15px/1.35 var(--f);color:var(--muted)}
.sec{font:500 15px var(--f);letter-spacing:.1px;color:var(--muted);margin:28px 2px 12px;display:flex;justify-content:space-between;align-items:center}

/* bits */
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 18px var(--f);flex:none;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 12px;font:500 13px var(--f);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:34px;padding:18px;font:600 19px var(--f);transition:transform .12s;text-align:center}
.pill:active,.fab:active,.circle:active,.btnsm:active,.role:active,button.card:active,button.big:active,.sc:active,.teamrow:active,.day:active{transform:scale(.97)}
.pill:disabled{opacity:.4}
.p-navy{background:var(--navy);color:#fff;box-shadow:0 10px 26px rgba(18,48,74,.25)}.p-lime{background:var(--lime);color:var(--navy)}.p-white{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);color:var(--navy)}
.link{display:block;margin:14px auto 0;padding:8px 16px;font:600 16px var(--f);color:var(--muted);text-align:center}
.danger{color:var(--red)!important}
.btnsm{border-radius:20px;padding:10px 16px;font:600 14px var(--f);transition:transform .12s;text-align:center}
.card{display:block;width:100%;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);border-radius:26px;padding:16px 18px;transition:transform .12s}
.fab{position:fixed;right:max(20px,calc(50% - 195px));bottom:calc(var(--safe-b) + 24px);background:#fff;color:var(--navy);border-radius:32px;padding:16px 22px 16px 18px;font:600 17px var(--f);display:flex;gap:8px;align-items:center;z-index:20;box-shadow:0 0 0 6px rgba(30,62,100,.55),0 14px 30px rgba(18,48,74,.25);transition:transform .12s}
.addrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;font:500 16px var(--f);color:var(--muted)}
.addic{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex:none;color:var(--faint)}
.empty{font:500 15px var(--f);color:var(--faint);padding:2px 2px 4px}
.back{width:48px;height:48px;margin:-6px 0 12px -2px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff}

/* week strip */
.week{display:flex;gap:7px;margin-top:22px}

.day.has{background:var(--lime)}.day.has small{color:var(--navy)}
.day.on{background:var(--navy);color:#fff}.day.on small{color:#c9cde6}
.day.on.has::after{content:"";position:absolute;bottom:7px;width:6px;height:6px;border-radius:50%;background:var(--lime)}
/* big alarm card */
.big{display:block;width:100%;border-radius:32px;padding:20px;background:var(--tb);color:var(--tf);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 18px 40px -12px var(--tbs);transition:transform .12s;text-align:left}

.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}

.sc b{font:600 17px var(--f);display:block}.sc small{display:block;font:500 13px var(--f);opacity:.78;margin-top:2px}
.sc .tm{font:600 26px var(--f);letter-spacing:-1px;font-variant-numeric:tabular-nums;flex:none}

.tag{display:inline-block;font:500 12px var(--f);letter-spacing:.1px;border-radius:10px;padding:3px 8px;background:rgba(1,20,60,.08);color:var(--navy);margin-top:6px;white-space:nowrap}
.sc .tag{background:rgba(255,255,255,.24);color:inherit}

.lrow{display:flex;align-items:center;gap:12px;padding:10px 2px}

.lrow+.lrow{border-top:1px solid var(--line)}
.ros{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px}

.ros span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ros .inv{opacity:.4}
.teamrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);border-radius:24px;padding:14px 16px;margin-bottom:10px;transition:transform .12s}
.teamrow .sw{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}

.teamrow b{font:600 17px var(--f);display:block}.teamrow small{font:500 13px var(--f);color:var(--muted)}

.inv-card small{font:500 14px var(--f);opacity:.8}

.onb{display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b) + 30px)}

.dim{position:fixed;inset:0;background:rgba(18,48,74,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:rgba(238,246,252,.82);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-top:1px solid #fff;border-radius:34px 34px 0 0;padding:12px 20px calc(var(--safe-b) + 24px);z-index:41;animation:up .32s cubic-bezier(.2,.8,.2,1);max-height:calc(var(--sh) * .92);overflow-y:auto}

.days{display:flex;gap:6px;margin-top:6px}
.days button{flex:1;height:46px;border-radius:16px;background:rgba(255,255,255,.45);border:1px solid var(--edge);font:600 15px var(--f);text-align:center}

.opt-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;font:600 17px var(--f)}

.opt-row .ck{margin-left:auto}
/* create */
.wheel{position:relative;z-index:0;height:400px;margin:6px -20px 0;overflow-x:clip}
.half{position:absolute;top:-46px;width:430px;height:492px;border-radius:50%;background:rgba(255,255,255,.42);filter:blur(9px);pointer-events:none}
.half.l{left:-262px}.half.r{right:-262px}
.cols{position:absolute;inset:0;display:flex;justify-content:center;gap:10px;padding-right:44px}
.wcol{height:100%;width:118px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol .it{height:76px;display:flex;align-items:center;font:500 88px/1 var(--f);letter-spacing:-2px;scroll-snap-align:center;font-variant-numeric:tabular-nums;will-change:transform,opacity}
.wcol.h .it{justify-content:flex-end;transform-origin:right center}
.wcol.m .it{justify-content:flex-start;transform-origin:left center}
.ampm{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.ampm button{border-radius:20px;padding:9px 13px;font:600 15px var(--f);background:rgba(255,255,255,.45);border:1px solid var(--edge)}

.opts{position:relative;z-index:1;display:flex;justify-content:space-around;margin-top:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px;padding:6px;border-radius:18px;transition:transform .12s;text-align:center}

.opt b{font:600 16px var(--f);margin-top:4px}.opt small{font:500 13px var(--f);color:var(--muted)}

.teamsel{position:relative}
.menu{position:absolute;right:0;top:44px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);border-radius:20px;padding:6px;min-width:190px;z-index:30;box-shadow:0 18px 40px rgba(1,20,60,.18);animation:pop .18s}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:14px;font:600 15px var(--f)}

.menu i{width:12px;height:12px;border-radius:50%;display:block}
/* ringing */
.ringwrap{background:var(--tb);min-height:var(--sh)}
.ringscr{color:var(--tf);min-height:var(--sh);display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b) + 34px)}
.r-top{text-align:center;font:500 15px var(--f);opacity:.82;margin-top:6px}
.r-time{text-align:center;font:500 112px/1 var(--f);letter-spacing:-3px;margin-top:46px;font-variant-numeric:tabular-nums}
.r-time span{font-size:30px;letter-spacing:0;margin-left:4px}
.pulse{animation:pulse 1s ease-in-out infinite}
.r-sub{text-align:center;font:600 22px var(--f);margin-top:14px}
.r-sub small{display:block;font:500 15px var(--f);opacity:.8;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(5,54px);gap:12px;justify-content:center;margin-top:40px}
.grid .av{width:54px;height:54px;font-size:19px}
.st-up{background:var(--lime);color:var(--navy)}
.st-snoozed{background:var(--purple);color:#fff}
.st-asleep{background:transparent;color:var(--tf);box-shadow:inset 0 0 0 2.5px currentColor;opacity:.75}
.st-excused{background:rgba(255,255,255,.14);color:var(--tf);opacity:.45}
.lime-team .st-up{background:var(--navy);color:var(--lime)}
.ringwrap{position:relative;overflow:hidden}
.ringwrap::before{content:"";position:absolute;width:520px;height:520px;left:50%;top:22%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);pointer-events:none}
.ringscr{position:relative}
.av.me::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--ta)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:18px;font:500 13px var(--f);opacity:.9;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.namegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:30px}
.namegrid div{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13px var(--f);min-width:0}
.namegrid .av{width:56px;height:56px;font-size:20px}
.namegrid span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
.r-act{margin-top:auto;padding-top:30px}
.r-act .pill{background:var(--ta);color:var(--tc);font-size:24px;padding:21px}
.r-act .link{color:var(--tf);opacity:.9}
/* invite */
.qrbox{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 30px rgba(40,90,160,.08);border-radius:32px;padding:24px;display:flex;flex-direction:column;align-items:center;margin-top:18px}
#qr svg{width:200px;height:200px}
.code{font:600 44px var(--f);letter-spacing:10px;margin-top:14px;padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translateX(-50%);background:rgba(18,48,74,.88);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;font:500 15px var(--f);padding:12px 18px;border-radius:20px;z-index:60;animation:toast .3s;white-space:nowrap}
/* motion */
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(7){animation-delay:.24s}.enter>*:nth-child(8){animation-delay:.28s}.enter>*:nth-child(n+9){animation-delay:.32s}
.enter>.fab{animation:none}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
</style>
</head>
<body>
<div id="stage">
  <div class="phone">
    <div id="sbar"><span id="sclock"></span><span class="ic">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5C5.2.5 2.7 1.6.8 3.4L2 4.7a8.6 8.6 0 0 1 6-2.4z"/><path d="M8 5.9c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4.1c-1.8 0-3.4.7-4.6 1.8l1.2 1.3A4.9 4.9 0 0 1 8 5.9z"/><path d="M10.2 8.6 8 11 5.8 8.6a3.2 3.2 0 0 1 4.4 0z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/><path d="M24.5 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
    </span></div>
    <i class="island"></i>
    <div id="app"></div>
    <button id="banner" type="button"></button>
    <i class="homebar"></i>
  </div>
</div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
/* ================= Setup ================= */
const SNOOZE_MS = 30000, MAX_SNOOZE = 2, RING_WINDOW = 10 * 60e3, ONLINE_MS = 35000;
const FAKES = ['Maya', 'Jordan', 'Theo', 'Priya', 'Leo', 'Ava', 'Marcus', 'Nina', 'Sam', 'Kai'];
const FAKE_EXCUSE = { i: 2, reason: 'Sick', note: 'Fever since last night' };   // Theo asks out of the next coach alarm
const STORE = 'team-alarm-v2';
const Q = new URLSearchParams(location.search);
const ROOM = (Q.get('team') || 'ixd415-v2').replace(/[^a-z0-9-]/gi, '').slice(0, 40) || 'ixd415-v2';
const BASE = 'team-alarm-v2/' + ROOM;
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const JOIN = (Q.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
// Team colors: [background, text, accent]
// Team colors: [background, text, accent, solid]
const TEAM_COLORS = [['linear-gradient(140deg,#5b8cff 0%,#63b4ff 100%)', '#ffffff', '#a6efc6', '#5f9dff'], ['linear-gradient(140deg,#3f7cf0 0%,#3fc6c0 100%)', '#ffffff', '#a6efc6', '#3fa0d8'],
  ['linear-gradient(140deg,#6fb7ff 0%,#8fe8d6 100%)', '#12304a', '#12304a', '#7fcfe8'], ['linear-gradient(140deg,#7ddcc4 0%,#93c3ff 100%)', '#143049', '#143049', '#88cfe3'],
  ['linear-gradient(140deg,#12304a 0%,#1f5f7a 100%)', '#ffffff', '#a6efc6', '#18485f'], ['linear-gradient(140deg,#bff2b0 0%,#9fe6cf 100%)', '#12304a', '#12304a', '#aeecc0']];
const AV_COLORS = ['#a6efc6', '#6fb7ff', '#5b8cff', '#9fd8ff', '#8fe3c0', '#133b55'];
const DAY1 = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (v, n) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, n);
const num = x => (typeof x === 'number' && isFinite(x) ? x : 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const rand = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmt = (hh, mm) => ({ hm: (hh % 12 || 12) + ':' + String(mm).padStart(2, '0'), ap: hh >= 12 ? 'PM' : 'AM' });
const tcol = c => TEAM_COLORS[c] || TEAM_COLORS[0];
const tvars = c => { const t = tcol(c); return `--tb:${t[0]};--tf:${t[1]};--ta:${t[2]};--tbs:${t[3]};--tc:${t[1] === '#ffffff' ? '#12304a' : '#ffffff'};--ring:${t[3]}`; };
const shortCoach = n => n.replace(/^coach\s+/i, '');

const I = (name, s = 22, w = 2.4) => {
  const P = {
    plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
    back: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 6l6 6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>',
    repeat: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>',
    qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/>'
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[name] || ''}</svg>`;
};

/* ================= State (this tab only; every visit starts fresh) ================= */
let saved = {};
try { saved = JSON.parse(sessionStorage.getItem(STORE)) || {}; } catch (e) {}
const S = Object.assign({
  key: 'p' + uid(), role: null, nick: '',
  joined: [], declined: [],          // team ids I'm on / said no to
  ownTeams: [],                      // coach: { id, name, color, code, invited: [{ key, name }] }
  alarms: [],                        // alarms I made: { id, team, name, hh, mm, days, date, coachRings, by, creator, v }
  skips: {},                         // coach: alarmId -> [dayKey]
  excuses: {},                       // player: occ -> { reason, note, at }
  decisions: {},                     // coach: playerKey|occ -> 'ok' | 'no'
  ring: {},                          // occ -> { status, snoozes, snoozeUntil, upAt }
  closed: [],                        // occs I dismissed after waking
  cache: { teams: {}, alarms: {} },  // last-seen teams/alarms from others (so they survive a dropped connection)
  pendingJoin: '',
  sound: 'Pulse', vibrate: true, contacts: '', phone: '', verified: false, since: Date.now(),
  log: []                            // things that happened on my side, for team activity: { t: teamId, at, text }
}, saved);
function logIt(teamId, text) { S.log.unshift({ t: teamId, at: Date.now(), text }); S.log = S.log.slice(0, 60); }
const buzz = p => { if (S.vibrate && navigator.vibrate) navigator.vibrate(p); };
if (JOIN && !S.joined.length) { S.pendingJoin = JOIN; if (!S.role) S.role = 'player'; }
function save() { try { sessionStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

const ui = { view: 'home', alarmId: null, teamId: null, sheet: null, draft: null, day: 0, toast: '', toastT: 0, menu: false,
  screen: '', lastHtml: '', prev: {}, seenInv: new Set(), confirm: null, excuseFor: null, newTeam: null, joinErr: '', occ: null, jb: {} };

/* ================= Sound, buzz, screen ================= */
let audio = null, wakeLock = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
  if (!wakeLock && navigator.wakeLock && S.nick) navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
}
// Alarm sounds people can pick in their profile: [wave, notes]
const SOUNDS = { Pulse: ['square', [[0, 880], [0.14, 1175], [0.28, 880], [0.42, 1175]]], Chime: ['sine', [[0, 1047], [0.18, 1319], [0.36, 1568], [0.54, 2093]]], Siren: ['sawtooth', [[0, 660], [0.12, 990], [0.24, 660], [0.36, 990], [0.48, 660], [0.6, 990]]] };
function tone(loud, pick) {
  if (!audio || audio.state !== 'running') return;
  const t = audio.currentTime, snd = SOUNDS[pick || S.sound] || SOUNDS.Pulse;
  const seq = loud ? snd[1] : [[0, 880], [0.16, 1175]];
  seq.forEach(([d, f]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = loud ? snd[0] : 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(loud ? 0.22 : 0.12, t + d + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.12);
    o.connect(g); g.connect(audio.destination); o.start(t + d); o.stop(t + d + 0.13);
  });
}

/* ================= Sync ================= */
const peers = new Map();
let client = null, live = false, brokerIx = 0;
function payload() {
  return { key: S.key, nick: S.nick, role: S.role, joined: S.joined, own: S.ownTeams, alarms: S.alarms, skips: S.skips,
    excuses: S.excuses, decisions: S.decisions, ring: S.ring, ts: Date.now() };
}
function publish() {
  save();
  if (live && S.nick && S.verified) try { client.publish(BASE + '/p/' + S.key, JSON.stringify(payload()), { retain: true, qos: 1 }); } catch (e) {}
}
function connect() {
  if (!window.mqtt) return;
  client = mqtt.connect(BROKERS[brokerIx], { connectTimeout: 8000, reconnectPeriod: 2500, clean: true, clientId: 'ta2-' + uid() });
  const fail = setTimeout(() => { if (!live) { client.end(true); brokerIx = (brokerIx + 1) % BROKERS.length; connect(); } }, 9000);
  client.on('connect', () => { clearTimeout(fail); live = true; client.subscribe(BASE + '/p/+', { qos: 1 }, () => publish()); });
  client.on('close', () => { live = false; });
  client.on('message', (topic, buf) => {
    const key = topic.slice(topic.lastIndexOf('/') + 1);
    if (key === S.key) return;
    if (!buf || !buf.length) { peers.delete(key); return; }
    try { const p = JSON.parse(buf.toString()); if (p && typeof p === 'object') { p.key = key; peers.set(key, p); } } catch (e) {}
  });
}
connect();
setInterval(publish, 10000);
window.addEventListener('pagehide', e => { if (!e.persisted && live && client) try { client.publish(BASE + '/p/' + S.key, '', { retain: true, qos: 0 }); } catch (x) {} });
const livePeers = () => { const now = Date.now(), out = []; for (const p of peers.values()) if (now - num(p.ts) < ONLINE_MS && clean(p.nick, 24)) out.push(p); return out; };
const peer = k => { const p = peers.get(k); return p && Date.now() - num(p.ts) < ONLINE_MS ? p : null; };

/* ================= Analytics (anonymous counts only, no names) ================= */
// Counts live at abacus.jasoncameron.dev under the namespace below. The class repo's analytics/ folder reads them.
const STATS_NS = 'd1n0s4urs-team-alarm';
const TRACK = /github\.io$/.test(location.hostname) && !Q.get('team');
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
function hit(key) { if (TRACK) fetch('https://abacus.jasoncameron.dev/hit/' + STATS_NS + '/' + key, { mode: 'cors', keepalive: true }).catch(() => {}); }
function hitOnce(key, scope = key) { if (ls.get('ta-stat-' + scope)) return; ls.set('ta-stat-' + scope, '1'); hit(key); }
hit('visits');
hitOnce('users');                                  // unique devices, ever
hitOnce('day-' + dkey(new Date()));                // unique devices per day
const ringTracked = new Set();

/* ================= Teams ================= */
function teamsAll() {
  const m = new Map(), lp = livePeers(), online = new Set(lp.map(p => p.key));
  const add = (t, coachKey, coachName) => {
    if (!t || typeof t.id !== 'string' || m.has(t.id)) return;
    m.set(t.id, { id: t.id, name: clean(t.name, 30) || 'Team', color: Math.max(0, Math.min(TEAM_COLORS.length - 1, num(t.color))), code: clean(t.code, 6),
      invited: Array.isArray(t.invited) ? t.invited.filter(x => x && typeof x.key === 'string').map(x => ({ key: x.key, name: clean(x.name, 24) || 'Player', at: num(x.at) })) : [],
      at: num(t.at), coachKey, coachName: clean(coachName, 24) || 'Coach' });
  };
  S.ownTeams.forEach(t => add(t, S.key, S.nick));
  for (const p of lp) (Array.isArray(p.own) ? p.own : []).forEach(t => { add(t, p.key, p.nick); if (t && S.joined.includes(t.id)) S.cache.teams[t.id] = Object.assign({}, t, { coachKey: p.key, coachName: p.nick }); });

const createTeams = () => myTeams().filter(t => S.role === 'coach' ? t.coachKey === S.key : true);

function header(tag) {
  const now = new Date(), hr = now.getHours(), hello = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

}

}
const teamRow = teamPill;
function liveCard(lo) {
  const t = team(lo.a.team), c = crew(lo), n = s => c.filter(m => m.status === s).length, f = fmt(lo.a.hh, lo.a.mm);
  return `<button class="big" style="${tvars(t.color)}" data-act="alarm" data-id="${esc(lo.a.id)}"><div class="row"><span class="chip on-team"><i></i>${esc(t.name)}</span><span class="chip" style="background:var(--ta);color:var(--tc)">${f.hm} ${f.ap}</span></div>
    <div class="nm" style="margin-top:14px">${esc(lo.a.name)}</div>
    <div class="stat"><div><b>${n('up')}</b><small>Up</small></div><div><b>${n('snoozed')}</b><small>Snoozing</small></div><div><b>${n('asleep')}</b><small>Asleep</small></div><div><b>${n('excused')}</b><small>Excused</small></div></div></button>`;
}
function ringView(kind) {
  const o = ui.occ, t = team(o.a.team), c = crew(o), r = S.ring[o.occ] || {}, left = MAX_SNOOZE - num(r.snoozes);
  const lime = tcol(t.color)[1] !== '#ffffff' ? 'lime-team' : '';
  const asleep = c.filter(m => m.status === 'asleep' || m.status === 'snoozed').length;
  const popc = m => (ui.prev[m.key] && ui.prev[m.key] !== m.status ? 'pop' : '');
  let mid = '', act = '';
  if (kind === 'ring') act = `<button class="pill" data-act="up">I'm up</button>${left > 0 ? `<button class="link" data-act="snooze">Snooze · ${left} left</button>` : ''}`;
  if (kind === 'snooze') { const s = Math.max(0, Math.ceil((num(r.snoozeUntil) - Date.now()) / 1000)); mid = `<div class="r-sub">Snoozing<small>Rings again in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</small></div>`; act = `<button class="pill" data-act="up">I'm up now</button>`; }
  if (kind === 'status') { mid = `<div class="r-sub">You're up<small>${asleep} ${asleep === 1 ? 'teammate' : 'teammates'} not up yet</small></div>`; act = `<button class="link" data-act="closeocc">Back to home</button>`; }
  if (kind === 'allup') { const ex = c.filter(m => m.status === 'excused').length; mid = `<div class="r-sub">Everyone's up<small>${c.filter(m => m.status === 'up').length} up${ex ? ' · ' + ex + ' excused' : ''}</small></div>`; act = `<button class="pill" data-act="closeocc">Close</button>`; }
  const big = kind === 'ring' || kind === 'snooze';
  return `<div class="ringwrap" style="${tvars(t.color)}"><div class="scr ringscr ${lime}">
    <div class="r-top">${esc(t.name)} · ${esc(o.a.name)}</div>
    <div class="r-time ${kind === 'ring' ? 'pulse' : ''}" style="${big ? '' : 'font-size:84px;margin-top:30px'}">${timeHtml(o.a.hh, o.a.mm)}</div>
    ${mid}

  const d = ui.draft;
  const build = (el, vals, cur, isHour) => {
    const reps = isHour ? 9 : 5, pad = (el.clientHeight - ITEM) / 2, n = vals.length;
    el.innerHTML = `<div style="height:${pad}px"></div>` + Array.from({ length: n * reps }, (_, i) => `<div class="it">${vals[i % n]}</div>`).join('') + `<div style="height:${pad}px"></div>`;
    const midStart = Math.floor(reps / 2) * n;
    el.scrollTop = (midStart + Math.max(0, vals.indexOf(cur))) * ITEM;
    const items = el.querySelectorAll('.it');
    const paint = () => { const c = el.scrollTop / ITEM, lo = Math.max(0, Math.floor(c) - 4), hi = Math.min(items.length - 1, Math.ceil(c) + 4);
      for (let i = lo; i <= hi; i++) { const dd = Math.abs(i - c); items[i].style.transform = `scale(${Math.max(.36, 1 - dd * .22)})`; items[i].style.opacity = Math.max(.1, 1 - dd * .3); } };
    let tmr = 0, raf = 0, drag = null;
    el.addEventListener('scroll', () => {
      cancelAnimationFrame(raf); raf = requestAnimationFrame(paint);
      clearTimeout(tmr); tmr = setTimeout(() => {
        if (drag) return;
        const i = Math.round(el.scrollTop / ITEM), k = ((i % n) + n) % n;
        if (isHour) d.h12 = +vals[k]; else d.mm = +vals[k];
        const j = midStart + k;   // hop back to the middle copy so it never runs out
        if (j !== i) { el.style.scrollSnapType = 'none'; el.scrollTop += (j - i) * ITEM; el.style.scrollSnapType = ''; paint(); }
      }, 140);
    }, { passive: true });
    // mouse drag (touch scrolls natively)
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; drag = { y: e.clientY, top: el.scrollTop }; el.style.scrollSnapType = 'none'; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => { if (drag) el.scrollTop = drag.top - (e.clientY - drag.y); });
    const end = () => { if (!drag) return; drag = null; const i = Math.round(el.scrollTop / ITEM); el.style.scrollSnapType = ''; el.scrollTo({ top: i * ITEM, behavior: 'smooth' }); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    paint();
  };
  build(document.getElementById('wh'), Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0')), String(d.h12).padStart(2, '0'), true);
  build(document.getElementById('wm'), Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0')), String(d.mm).padStart(2, '0'), false);
}

/* ================= Actions ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) { if (ui.menu && !e.target.closest('.menu')) { ui.menu = false; render(true); } return; }
  unlockAudio();
  if (b === $banner) hideBanner();
  const act = b.dataset.act, D = b.dataset, now = Date.now();
  switch (act) {
    case 'role': S.role = D.v; save(); break;
    case 'unrole': S.role = null; save(); break;
    case 'unname': S.nick = ''; save(); break;
    case 'unphone': S.phone = ''; save(); break;
    case 'resend': sendCode(); toast('New code sent'); break;
    case 'fillcode': { const inp = document.getElementById('otpIn'); if (inp && ui.otp) { inp.value = ui.otp; inp.dispatchEvent(new Event('input')); } return; }
    case 'home': ui.view = 'home'; ui.sheet = null; break;
    case 'me': ui.view = 'me'; break;
    case 'sound': S.sound = D.v; save(); tone(true, D.v); break;
    case 'vibrate': S.vibrate = !S.vibrate; save(); buzz(80); break;
    case 'askreset': ui.confirm = { title: 'Sign out?', body: 'This phone leaves its teams and starts over from the beginning.', label: 'Sign out', act: 'reset' }; ui.sheet = 'confirm'; break;
    case 'reset': try { sessionStorage.removeItem(STORE); if (live && client) client.publish(BASE + '/p/' + S.key, '', { retain: true, qos: 0 }); } catch (x) {} location.href = location.pathname + (Q.get('team') ? '?team=' + ROOM : ''); return;
    case 'day': ui.day = +D.i; break;
    case 'alarm': ui.alarmId = D.id; ui.view = 'alarm'; break;
    case 'team': ui.teamId = D.id; ui.view = 'team'; break;
    case 'invite': ui.teamId = D.id; ui.view = 'invite'; break;
    case 'newteam': ui.newTeam = { name: '', color: 0, picked: [], exclude: [], addTo: null }; ui.sheet = 'newteam'; break;
    case 'addpeople': { const t = team(ui.teamId); ui.newTeam = { name: '', color: 0, picked: [], exclude: members(t).map(m => m.key), addTo: t.id }; ui.sheet = 'newteam'; break; }
    case 'code': ui.joinErr = ''; ui.sheet = 'code'; break;
    case 'jointeam': { hit('joins'); const t = team(D.id); joinTeam(D.id); toast('You joined ' + (t ? t.name : 'the team')); publish(); break; }
    case 'declineteam': S.declined.push(D.id); publish(); break;
    case 'closesheet': ui.sheet = null; ui.confirm = null; break;
    case 'shareinvite': { const t = team(ui.teamId), url = inviteUrl(t);
      if (navigator.share) navigator.share({ title: 'Join ' + t.name, text: 'Join ' + t.name + ' on Team Alarm. Code: ' + t.code, url }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { toast('Link copied'); render(true); }).catch(() => {});
      return; }
    case 'new': case 'edit': {
      const teams = createTeams(); if (!teams.length) return;
      if (act === 'edit') { const a = alarmById(ui.alarmId); ui.draft = { id: a.id, team: a.team, name: a.name, h12: a.hh % 12 || 12, mm: a.mm, ap: a.hh >= 12 ? 'PM' : 'AM', days: a.days.slice(), coachRings: !!a.coachRings }; }
      else { const s = new Date(now + 2 * 60e3); ui.draft = { team: (D.team && teams.some(x => x.id === D.team)) ? D.team : teams[0].id, name: '', h12: s.getHours() % 12 || 12, mm: s.getMinutes(), ap: s.getHours() >= 12 ? 'PM' : 'AM', days: [], coachRings: false }; }
      ui.menu = false; ui.view = 'create'; break; }
    case 'teammenu': ui.menu = !ui.menu; break;
    case 'pickteam': ui.draft.team = D.id; ui.menu = false; break;
    case 'ap': ui.draft.ap = D.v; document.querySelectorAll('.ampm button').forEach(x => x.classList.toggle('on', x.dataset.v === D.v)); return;
    case 'repeat': ui.sheet = 'repeat'; break;
    // Repeat sheet and options: update in place so the sheet doesn't slide up again on every tap.
    case 'setdays': ui.draft.days = D.v ? D.v.split(',').map(Number) : []; patchRepeat(); return;
    case 'toggleday': { const i = +D.i, ds = ui.draft.days; ui.draft.days = (ds.includes(i) ? ds.filter(x => x !== i) : ds.concat(i)).sort(); patchRepeat(); return; }
    case 'ringme': { ui.draft.coachRings = !ui.draft.coachRings; const sm = b.querySelector('small'); if (sm) sm.textContent = ui.draft.coachRings ? 'Yes' : 'No, just watch'; return; }
    case 'cancel': ui.view = ui.draft && ui.draft.id ? 'alarm' : 'home'; ui.draft = null; break;
    case 'save': {
      const d = ui.draft, hh = (d.h12 % 12) + (d.ap === 'PM' ? 12 : 0);
      const at = new Date(); at.setHours(hh, d.mm, 0, 0); if (at.getTime() <= now + 1000) at.setDate(at.getDate() + 1);
      const old = d.id ? S.alarms.find(a => a.id === d.id) : null;
      const a = { id: d.id || 'a' + uid(), team: d.team, name: clean(d.name, 40) || 'Alarm', hh, mm: d.mm, days: d.days.slice(), date: dkey(at), coachRings: S.role === 'coach' ? !!d.coachRings : true, by: old ? old.by : S.nick, creator: old ? old.creator : S.key, made: old ? (old.made || old.v) : now, v: now };
      S.alarms = S.alarms.filter(x => x.id !== a.id).concat(a); if (!d.id) hit('alarms');
      ui.draft = null; ui.alarmId = a.id; ui.view = d.id ? 'alarm' : 'home'; toast(d.id ? 'Alarm updated' : 'Alarm set for everyone on ' + ((team(a.team) || {}).name || 'the team')); publish(); break; }
    case 'skip': { const a = alarmById(ui.alarmId), k = D.dk, cur = S.skips[a.id] || [], was = cur.includes(k); S.skips[a.id] = was ? cur.filter(x => x !== k) : cur.concat(k); logIt(a.team, (was ? 'You turned ' + a.name + ' back on ' : 'You canceled ' + a.name + ' ') + dayWord(new Date(k + 'T00:00'))); toast(was ? "It's back on" : 'Canceled. The team sees it'); publish(); break; }
    case 'excuse': ui.excuseFor = { occ: D.o, reason: '', note: '' }; ui.sheet = 'excuse'; break;
    case 'decide': { hit(D.v === 'ok' ? 'excuse-approved' : 'excuse-denied'); S.decisions[D.k + '|' + D.o] = D.v; const da = alarmById(D.o.split('@')[0]); if (da) logIt(da.team, (D.v === 'ok' ? 'You excused ' : 'You said no to ') + (D.n || 'a player') + ' for ' + da.name); toast(D.v === 'ok' ? 'Excused' : 'Request denied'); publish(); break; }
    case 'askdelete': ui.confirm = { title: 'Delete this alarm?', body: 'It goes away for everyone on the team.', label: 'Delete alarm', act: 'delalarm' }; ui.sheet = 'confirm'; break;
    case 'delalarm': S.alarms = S.alarms.filter(a => a.id !== ui.alarmId); delete S.cache.alarms[ui.alarmId]; ui.sheet = null; ui.confirm = null; ui.view = 'home'; toast('Alarm deleted'); publish(); break;
    case 'askleave': { const t = team(ui.teamId), mine = t.coachKey === S.key;
      ui.confirm = mine ? { title: 'Delete ' + esc(t.name) + '?', body: 'The team and its alarms go away for everyone.', label: 'Delete team', act: 'leaveteam' } : { title: 'Leave ' + esc(t.name) + '?', body: "You'll stop getting its alarms.", label: 'Leave team', act: 'leaveteam' };
      ui.sheet = 'confirm'; break; }
    case 'leaveteam': { const id = ui.teamId; S.ownTeams = S.ownTeams.filter(t => t.id !== id); S.alarms = S.alarms.filter(a => a.team !== id); S.joined = S.joined.filter(x => x !== id); S.declined.push(id); delete S.cache.teams[id]; ui.sheet = null; ui.confirm = null; ui.view = 'home'; publish(); break; }
    // ringing
    case 'up': { const o = ui.occ; if (myStatus(o.occ) !== 'up') hit('wakeups'); S.ring[o.occ] = Object.assign({}, S.ring[o.occ] || {}, { status: 'up', upAt: now, at: o.at }); logIt(o.a.team, 'You were up for ' + o.a.name); publish(); break; }
    case 'snooze': { const o = ui.occ, r = S.ring[o.occ] || { snoozes: 0 }; if (num(r.snoozes) >= MAX_SNOOZE) return; hit('snoozes'); S.ring[o.occ] = { status: 'snoozed', snoozes: num(r.snoozes) + 1, snoozeUntil: now + SNOOZE_MS, upAt: 0, at: o.at }; publish(); break; }
    case 'closeocc': S.closed.push(ui.occ.occ); ui.view = 'home'; save(); break;
    default: return;
  }
  render(true);
});

window.__ta = { S, ui, render };   // for automated checks
render(true);
setInterval(render, 250);
})();
</script>
